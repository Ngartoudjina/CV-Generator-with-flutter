# Le modèle Flutter génère -Xmx8G -XX:MaxMetaspaceSize=4G, soit 12 Go de
# réservation JVM. Sur une machine de 16 Go partagée avec un IDE et un
# navigateur, la compilation échoue avec « Out of memory » avant même de
# démarrer. 2 Go suffisent largement pour ce projet.
org.gradle.jvmargs=-Xmx2G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError

# Un seul démon Gradle, arrêté après inactivité — évite d'empiler les JVM
# résidentes entre deux compilations.
org.gradle.daemon=true
org.gradle.parallel=false

# Délais réseau allongés. Les valeurs par défaut de Gradle (30 s) provoquent
# des « Read timed out » sur une connexion lente, au milieu du téléchargement
# des artefacts du moteur Flutter (plusieurs dizaines de Mo chacun). Trois
# minutes laissent le temps à un gros fichier de passer.
systemProp.org.gradle.internal.http.socketTimeout=180000
systemProp.org.gradle.internal.http.connectionTimeout=180000
systemProp.http.socketTimeout=180000
systemProp.http.connectionTimeout=180000
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
