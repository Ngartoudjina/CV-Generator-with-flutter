name: cvgenerator
description: "CV Generator — votre parcours, sublimé par l'intelligence artificielle."
publish_to: 'none'
version: 1.0.0+1

environment:
  # Flutter >= 3.27 requis : le code utilise Color.withValues(alpha:),
  # introduit avec Dart 3.6 / Flutter 3.27 (remplace withOpacity, déprécié).
  sdk: ^3.6.0
  flutter: '>=3.27.0'

dependencies:
  flutter:
    sdk: flutter

  # State management — remplace CvViewModel / StateFlow
  provider: ^6.1.2

  # Remplace SharedPreferences (Android) — même API des deux côtés
  shared_preferences: ^2.3.2

  # Génération PDF — remplace android.graphics.pdf.PdfDocument.
  # `printing` partage les octets directement : pas d'écriture disque, donc
  # pas de dart:io ni de path_provider, et la cible web reste compilable.
  pdf: ^3.11.1
  printing: ^5.13.2

  # Annotations (@visibleForTesting) sans dépendre de flutter/foundation, ce
  # qui garde pdf_generator.dart exécutable en Dart pur.
  meta: ^1.15.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/

  # Inter en fichier variable, embarqué plutôt que téléchargé à l'exécution
  # (le paquet google_fonts va chercher ses polices sur le réseau au premier
  # affichage — inacceptable ici, et cassé hors ligne).
  # Trois familles, trois rôles distincts — c'est la maquette qui l'impose :
  # serif pour les titres, monospace pour toute la métadonnée d'interface,
  # sans-serif pour le corps. Fichiers variables embarqués plutôt que le
  # paquet google_fonts, qui les télécharge au premier affichage.
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Variable.ttf
    - family: PlayfairDisplay
      fonts:
        - asset: assets/fonts/PlayfairDisplay-Variable.ttf
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Variable.ttf
